# PIPELINE DEFINITION
# Name: timeseries-tft-training-pipeline
# Description: End to end pipeline for training the Temporal Fusion Transformer model
# Inputs:
#    location: str
#    project: str
#    vertex_experiment_name: str
#    vertex_run_name: str
components:
  comp-dataloader-component:
    executorLabel: exec-dataloader-component
    inputDefinitions:
      artifacts:
        preprocessed_data_input:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        artifact_bucket:
          parameterType: STRING
        base_output_directory:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        display_name:
          defaultValue: DataLoader Pipeline
          isOptional: true
          parameterType: STRING
        enable_web_access:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        encryption_spec_key_name:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        labels:
          defaultValue: {}
          isOptional: true
          parameterType: STRUCT
        location:
          parameterType: STRING
        max_wait_duration:
          defaultValue: 86400s
          isOptional: true
          parameterType: STRING
        network:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        persistent_resource_id:
          defaultValue: '{{$.pipeline_persistent_resource_id}}'
          isOptional: true
          parameterType: STRING
        project:
          parameterType: STRING
        reserved_ip_ranges:
          defaultValue: []
          isOptional: true
          parameterType: LIST
        restart_job_on_worker_restart:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        service_account:
          defaultValue: gcp-vertexai-mlops-blueprint@gcp-vertexai-mlops-blueprint.iam.gserviceaccount.com
          isOptional: true
          parameterType: STRING
        strategy:
          defaultValue: STANDARD
          isOptional: true
          parameterType: STRING
        tensorboard:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        timeout:
          defaultValue: 604800s
          isOptional: true
          parameterType: STRING
        vertex_experiment_name:
          parameterType: STRING
        vertex_run_name:
          parameterType: STRING
        worker_pool_specs:
          defaultValue:
          - container_spec:
              args:
              - --executor_input
              - '{{$.json_escape[1]}}'
              - --function_to_execute
              - dataloader_component
              command:
              - sh
              - -c
              - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip\
                \ || python3 -m ensurepip --user || apt-get install python3-pip\n\
                fi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet\
                \ --no-warn-script-location 'kfp==2.13.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
                \ python_version<\"3.9\"'  &&  python3 -m pip install --quiet --no-warn-script-location\
                \ 'pandas' 'numpy' 'pytorch_forecasting' 'torch' 'google-cloud-storage'\
                \ 'google-cloud-aiplatform' && \"$0\" \"$@\"\n"
              - sh
              - -ec
              - 'program_path=$(mktemp -d)


                printf "%s" "$0" > "$program_path/ephemeral_component.py"

                _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

                '
              - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing\
                \ import *\n\ndef dataloader_component(\n    project: str,\n    location:\
                \ str,\n    artifact_bucket: str,\n    vertex_experiment_name: str,\n\
                \    vertex_run_name: str,\n    preprocessed_data_input: dsl.Input[dsl.Dataset],\n\
                \    training_output: dsl.Output[dsl.Dataset],\n    train_loader_output:\
                \ dsl.Output[dsl.Dataset],\n    val_loader_output: dsl.Output[dsl.Dataset],\n\
                ): \n    from steps.dataloader_step import dataloader_step\n\n   \
                \ dataloader_step(\n        project = project,\n        location =\
                \ location,\n        artifact_bucket = artifact_bucket,\n        vertex_experiment_name\
                \ = vertex_experiment_name,\n        vertex_run_name = vertex_run_name,\n\
                \        preprocessed_data_input = preprocessed_data_input.path,\n\
                \        training_output = training_output.path,\n        train_loader_output\
                \ = train_loader_output.path,\n        val_loader_output = val_loader_output.path,\n\
                \    )\n\n"
              env: []
              image_uri: asia-south1-docker.pkg.dev/gcp-vertexai-mlops-blueprint/gcp-vertex-ai-mlops-blueprint/my-base-image:v15
            disk_spec:
              boot_disk_size_gb: 100.0
              boot_disk_type: pd-ssd
            machine_spec:
              machine_type: e2-standard-4
            replica_count: 1.0
          isOptional: true
          parameterType: LIST
    outputDefinitions:
      artifacts:
        train_loader_output:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        training_output:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        val_loader_output:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        gcp_resources:
          parameterType: STRING
  comp-deploy-component:
    executorLabel: exec-deploy-component
    inputDefinitions:
      parameters:
        artifact_bucket:
          parameterType: STRING
        base_output_directory:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        display_name:
          defaultValue: Deploy and Monitor Pipeline
