          defaultValue: gcp-vertexai-mlops-blueprint@gcp-vertexai-mlops-blueprint.iam.gserviceaccount.com
          isOptional: true
          parameterType: STRING
        strategy:
          defaultValue: STANDARD
          isOptional: true
          parameterType: STRING
        tensorboard:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        timeout:
          defaultValue: 604800s
          isOptional: true
          parameterType: STRING
        vertex_experiment_name:
          parameterType: STRING
        vertex_run_name:
          parameterType: STRING
        worker_pool_specs:
          defaultValue:
          - container_spec:
              args:
              - --executor_input
              - '{{$.json_escape[1]}}'
              - --function_to_execute
              - training_component
              command:
              - sh
              - -c
              - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip\
                \ || python3 -m ensurepip --user || apt-get install python3-pip\n\
                fi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet\
                \ --no-warn-script-location 'kfp==2.13.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
                \ python_version<\"3.9\"'  &&  python3 -m pip install --quiet --no-warn-script-location\
                \ 'pytorch_forecasting' 'torch' 'lightning' 'tensorboard' 'pytorch_optimizer'\
                \ 'google-cloud-storage' 'google-cloud-aiplatform' && \"$0\" \"$@\"\
                \n"
              - sh
              - -ec
              - 'program_path=$(mktemp -d)


                printf "%s" "$0" > "$program_path/ephemeral_component.py"

                _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

                '
              - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing\
                \ import *\n\ndef training_component(\n    project: str,\n    location:\
                \ str,\n    artifact_bucket: str,\n    vertex_experiment_name: str,\n\
                \    vertex_run_name: str,\n    training_input: dsl.Input[dsl.Dataset],\n\
                \    train_loader_input: dsl.Input[dsl.Dataset],\n    val_loader_input:\
                \ dsl.Input[dsl.Dataset],\n    best_params_input: dsl.Input[dsl.Artifact],\n\
                \    pth_model_output: dsl.Output[dsl.Model],\n    ckpt_model_output:\
                \ dsl.Output[dsl.Model]\n):\n    from steps.training_step import training_step\n\
                \n    training_step(\n        project = project,\n        location\
                \ = location,\n        artifact_bucket = artifact_bucket,\n      \
                \  vertex_experiment_name = vertex_experiment_name,\n        vertex_run_name\
                \ = vertex_run_name,\n        training_input = training_input.path,\n\
                \        train_loader_input = train_loader_input.path,\n        val_loader_input\
                \ = val_loader_input.path,\n        best_params_input = best_params_input.path,\n\
                \        pth_model_output = pth_model_output.path,\n        ckpt_model_output\
                \ = ckpt_model_output.path\n    )\n\n"
              env: []
              image_uri: asia-south1-docker.pkg.dev/gcp-vertexai-mlops-blueprint/gcp-vertex-ai-mlops-blueprint/my-base-image:v15
            disk_spec:
              boot_disk_size_gb: 100.0
              boot_disk_type: pd-ssd
            machine_spec:
              machine_type: e2-standard-4
            replica_count: 1.0
          isOptional: true
          parameterType: LIST
    outputDefinitions:
      artifacts:
        ckpt_model_output:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        pth_model_output:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        gcp_resources:
          parameterType: STRING
  comp-vertex-pipelines-notification-email:
    executorLabel: exec-vertex-pipelines-notification-email
    inputDefinitions:
      parameters:
        pipeline_task_final_status:
          isOptional: true
          parameterType: TASK_FINAL_STATUS
        recipients:
          description: A list of email addresses to send a notification to.
          parameterType: LIST
