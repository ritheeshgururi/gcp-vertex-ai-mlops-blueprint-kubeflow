pipelineInfo:
  description: End to end pipeline for training the Temporal Fusion Transformer model
  name: timeseries-tft-training-pipeline
root:
  dag:
    tasks:
      exit-handler-1:
        componentRef:
          name: comp-exit-handler-1
        inputs:
          parameters:
            pipelinechannel--location:
              componentInputParameter: location
            pipelinechannel--project:
              componentInputParameter: project
            pipelinechannel--vertex_experiment_name:
              componentInputParameter: vertex_experiment_name
            pipelinechannel--vertex_run_name:
              componentInputParameter: vertex_run_name
        taskInfo:
          name: exit-handler-1
      vertex-pipelines-notification-email:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-vertex-pipelines-notification-email
        dependentTasks:
        - exit-handler-1
        inputs:
          parameters:
            pipeline_task_final_status:
              taskFinalStatus:
                producerTask: exit-handler-1
            recipients:
              runtimeValue:
                constant:
                - ritheeshgururi187@gmail.com
        taskInfo:
          name: vertex-pipelines-notification-email
        triggerPolicy:
          strategy: ALL_UPSTREAM_TASKS_COMPLETED
  inputDefinitions:
    parameters:
      location:
        parameterType: STRING
      project:
        parameterType: STRING
      vertex_experiment_name:
        parameterType: STRING
      vertex_run_name:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.13.0
