                componentInputParameter: pipelinechannel--project
              vertex_experiment_name:
                componentInputParameter: pipelinechannel--vertex_experiment_name
              vertex_run_name:
                componentInputParameter: pipelinechannel--vertex_run_name
          taskInfo:
            name: training-component
