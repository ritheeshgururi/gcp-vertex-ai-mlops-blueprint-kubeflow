# PIPELINE DEFINITION
# Name: endoint-inference-pipeline
# Description: End to end pipeline for endpoint prediction
# Inputs:
#    data_path: str
#    endpoint_id: str
#    gcs_bucket: str
#    location: str
#    project: str
components:
  comp-endpoint-prediction-component:
    executorLabel: exec-endpoint-prediction-component
    inputDefinitions:
      parameters:
        base_output_directory:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        data_path:
          parameterType: STRING
        display_name:
          defaultValue: endoint-inference-pipeline
          isOptional: true
          parameterType: STRING
        enable_web_access:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        encryption_spec_key_name:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        endpoint_id:
          parameterType: STRING
        gcs_bucket:
          parameterType: STRING
        labels:
          defaultValue: {}
          isOptional: true
          parameterType: STRUCT
        location:
          parameterType: STRING
        max_wait_duration:
          defaultValue: 86400s
          isOptional: true
          parameterType: STRING
        network:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        persistent_resource_id:
          defaultValue: '{{$.pipeline_persistent_resource_id}}'
          isOptional: true
          parameterType: STRING
        project:
          parameterType: STRING
        reserved_ip_ranges:
          defaultValue: []
          isOptional: true
          parameterType: LIST
        restart_job_on_worker_restart:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        service_account:
          defaultValue: gcp-vertexai-mlops-blueprint@gcp-vertexai-mlops-blueprint.iam.gserviceaccount.com
          isOptional: true
          parameterType: STRING
        strategy:
          defaultValue: STANDARD
          isOptional: true
          parameterType: STRING
        tensorboard:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        timeout:
          defaultValue: 604800s
          isOptional: true
          parameterType: STRING
        worker_pool_specs:
          defaultValue:
          - container_spec:
              args:
              - --executor_input
              - '{{$.json_escape[1]}}'
              - --function_to_execute
              - endpoint_prediction_component
              command:
              - sh
              - -c
              - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip\
                \ || python3 -m ensurepip --user || apt-get install python3-pip\n\
                fi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet\
                \ --no-warn-script-location 'kfp==2.13.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
                \ python_version<\"3.9\"'  &&  python3 -m pip install --quiet --no-warn-script-location\
                \ 'pandas' 'google-cloud-storage' 'google-cloud-aiplatform' && \"\
                $0\" \"$@\"\n"
              - sh
              - -ec
              - 'program_path=$(mktemp -d)


                printf "%s" "$0" > "$program_path/ephemeral_component.py"

                _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

                '
              - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing\
                \ import *\n\ndef endpoint_prediction_component(\n    project: str,\n\
                \    location: str,\n    gcs_bucket: str,\n    data_path: str,\n \
                \   endpoint_id: str,\n    predictions_output: dsl.Output[dsl.Dataset]\n\
                ):\n    from steps.endpoint_prediction_step import endpoint_prediction_step\n\
                \n    endpoint_prediction_step(\n        project = project,\n    \
                \    location = location,\n        gcs_bucket = gcs_bucket,\n    \
                \    data_path = data_path,\n        endpoint_id = endpoint_id,\n\
                \        predictions_output = predictions_output.path\n    )\n\n"
              env: []
              image_uri: asia-south1-docker.pkg.dev/gcp-vertexai-mlops-blueprint/gcp-vertex-ai-mlops-blueprint/inference-image:v4
            disk_spec:
              boot_disk_size_gb: 100.0
              boot_disk_type: pd-ssd
            machine_spec:
              machine_type: n2-standard-4
            replica_count: 1.0
          isOptional: true
          parameterType: LIST
    outputDefinitions:
      artifacts:
        predictions_output:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        gcp_resources:
          parameterType: STRING
  comp-exit-handler-1:
    dag:
      tasks:
        endpoint-prediction-component:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-endpoint-prediction-component
          inputs:
            parameters:
              data_path:
                componentInputParameter: pipelinechannel--data_path
              endpoint_id:
                componentInputParameter: pipelinechannel--endpoint_id
              gcs_bucket:
                componentInputParameter: pipelinechannel--gcs_bucket
              location:
                componentInputParameter: pipelinechannel--location
              project:
                componentInputParameter: pipelinechannel--project
          taskInfo:
            name: endpoint-prediction-component
    inputDefinitions:
      parameters:
        pipelinechannel--data_path:
          parameterType: STRING
        pipelinechannel--endpoint_id:
          parameterType: STRING
        pipelinechannel--gcs_bucket:
          parameterType: STRING
        pipelinechannel--location:
          parameterType: STRING
        pipelinechannel--project:
          parameterType: STRING
  comp-vertex-pipelines-notification-email:
    executorLabel: exec-vertex-pipelines-notification-email
    inputDefinitions:
      parameters:
        pipeline_task_final_status:
          isOptional: true
          parameterType: TASK_FINAL_STATUS
        recipients:
          description: A list of email addresses to send a notification to.
          parameterType: LIST
deploymentSpec:
  executors:
    exec-endpoint-prediction-component:
      container:
        args:
        - --type
        - CustomJob
        - --payload
        - '{"display_name": "{{$.inputs.parameters[''display_name'']}}", "job_spec":
          {"worker_pool_specs": {{$.inputs.parameters[''worker_pool_specs'']}}, "scheduling":
          {"timeout": "{{$.inputs.parameters[''timeout'']}}", "restart_job_on_worker_restart":
          {{$.inputs.parameters[''restart_job_on_worker_restart'']}}, "strategy":
          "{{$.inputs.parameters[''strategy'']}}", "max_wait_duration": "{{$.inputs.parameters[''max_wait_duration'']}}"},
          "service_account": "{{$.inputs.parameters[''service_account'']}}", "tensorboard":
          "{{$.inputs.parameters[''tensorboard'']}}", "enable_web_access": {{$.inputs.parameters[''enable_web_access'']}},
          "network": "{{$.inputs.parameters[''network'']}}", "reserved_ip_ranges":
          {{$.inputs.parameters[''reserved_ip_ranges'']}}, "base_output_directory":
          {"output_uri_prefix": "{{$.inputs.parameters[''base_output_directory'']}}"},
          "persistent_resource_id": "{{$.inputs.parameters[''persistent_resource_id'']}}"},
          "labels": {{$.inputs.parameters[''labels'']}}, "encryption_spec": {"kms_key_name":
          "{{$.inputs.parameters[''encryption_spec_key_name'']}}"}}'
        - --project
        - '{{$.inputs.parameters[''project'']}}'
        - --location
        - '{{$.inputs.parameters[''location'']}}'
        - --gcp_resources
        - '{{$.outputs.parameters[''gcp_resources''].output_file}}'
        command:
        - python3
        - -u
        - -m
        - google_cloud_pipeline_components.container.v1.custom_job.launcher
        image: gcr.io/ml-pipeline/google-cloud-pipeline-components:2.20.0
    exec-vertex-pipelines-notification-email:
      container:
        args:
        - --type
        - VertexNotificationEmail
        - --payload
        - ''
        command:
        - python3
        - -u
        - -m
        - google_cloud_pipeline_components.container.v1.vertex_notification_email.executor
        image: gcr.io/ml-pipeline/google-cloud-pipeline-components:2.20.0
pipelineInfo:
  description: End to end pipeline for endpoint prediction
  name: endoint-inference-pipeline
root:
  dag:
    tasks:
      exit-handler-1:
        componentRef:
          name: comp-exit-handler-1
        inputs:
          parameters:
            pipelinechannel--data_path:
              componentInputParameter: data_path
            pipelinechannel--endpoint_id:
              componentInputParameter: endpoint_id
            pipelinechannel--gcs_bucket:
              componentInputParameter: gcs_bucket
            pipelinechannel--location:
              componentInputParameter: location
            pipelinechannel--project:
              componentInputParameter: project
        taskInfo:
          name: exit-handler-1
      vertex-pipelines-notification-email:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-vertex-pipelines-notification-email
        dependentTasks:
        - exit-handler-1
        inputs:
          parameters:
            pipeline_task_final_status:
              taskFinalStatus:
                producerTask: exit-handler-1
            recipients:
              runtimeValue:
                constant:
                - ritheeshgururi187@gmail.com
        taskInfo:
          name: vertex-pipelines-notification-email
        triggerPolicy:
          strategy: ALL_UPSTREAM_TASKS_COMPLETED
  inputDefinitions:
    parameters:
      data_path:
        parameterType: STRING
      endpoint_id:
        parameterType: STRING
      gcs_bucket:
        parameterType: STRING
      location:
        parameterType: STRING
      project:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.13.0
